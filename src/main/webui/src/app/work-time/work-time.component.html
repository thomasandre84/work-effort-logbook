<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>WorkTime</mat-card-title>
   </mat-card-header>
  <mat-card-content>
    <p>startTime: {{ getStartTime() }}</p>
    <p>endTime: {{ getEndTime() }}</p>
    <p>effective working time in minutes: {{ workTime().workingMinutes }}</p>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-button>Edit</button>
    <button mat-button>Delete</button>
  </mat-card-actions>
</mat-card>
