quarkus.datasource.db-kind=h2
#quarkus.datasource.username=username-default
quarkus.datasource.jdbc.url=jdbc:h2:mem:default
#quarkus.datasource.jdbc.max-size=13
#quarkus.datasource.jdbc.url=jdbc:h2:file:data/database;AUTO_SERVER=true;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true

quarkus.http.cors=true
%dev.quarkus.http.cors.origins=/.*/
%dev.quarkus.http.port=8085

quarkus.quinoa.package-manager-install.node-version=22.4.1
quarkus.quinoa.package-manager-install.npm-version=10.8.1
quarkus.quinoa.dev-server.port=4200
quarkus.quinoa.build-dir=dist/browser